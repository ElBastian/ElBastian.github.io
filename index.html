<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Página shida de Bastian</title>
    <script>
        (function () {
            var tema = null;
            try { tema = localStorage.getItem('tema'); } catch (e) {}
            if (tema !== 'light' && tema !== 'dark') {
                tema = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
            }
            document.documentElement.dataset.theme = tema;
        })();
    </script>
    <style>#intro-matrix{z-index:2147483647;clip-path:inset(0);background:#000;transition:clip-path 1.2s ease-in-out;position:fixed;inset:0}#intro-matrix.saliendo{clip-path:inset(100% 0 0)}#intro-matrix canvas{width:100%;height:100%;display:block}</style>
  <script type="module" crossorigin src="/assets/index-IVeIzsNV.js"></script>
  <link rel="stylesheet" crossorigin href="/assets/index-BvSe-UaJ.css">
</head>

<body>
    <div id="intro-matrix" aria-hidden="true" hidden><canvas></canvas></div>
    <script>
        (function () {
            const SOLO_PRIMERA_VEZ = true;
            const DURACION = 2000;

            var capa = document.getElementById('intro-matrix');
            var yaVista = false;
            try { yaVista = localStorage.getItem('introVista') !== null; } catch (e) {}

            var navegacion = performance.getEntriesByType('navigation')[0];
            var forzarIntro = !!navegacion && (navegacion.type === 'reload' || navegacion.type === 'back_forward');

            document.documentElement.dataset.introDuracion = DURACION;

            if (SOLO_PRIMERA_VEZ && yaVista && !forzarIntro) {
                capa.remove();
                return;
            }
            capa.hidden = false;
        })();
    </script>
    <div id="root"></div>
</body>

</html>
